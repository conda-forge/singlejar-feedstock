schema_version: 1

context:
  version: "9.3.1"
  base_url: https://github.com/bazelbuild/bazel/releases/download
  bz_os: ${{ "linux" if linux else "darwin" }}
  bz_arch: ${{ "x86_64" if x86_64 else "arm64" }}
  bz_hash: ${{ "444c309e4d3a3007ef39debdf483e4399912a7d0073f52dfb56352a15a727dd8" if build_platform == "linux-64" else
               "b9dfab19c2f67d78f14aae8c6f250d40040177263c64a8cdf5008cd8e3a7db73" if build_platform == "linux-aarch64" else
               "4fdea4f435654aac531a904f6a0513576e48df2d9bc03d85b7aaaeb913c3cedb" if build_platform == "osx-64" else
               "68ccda4efe08b9f25b4cf480dadf7ffec428deaac0fe4868936c6085a80089dd" if build_platform == "osx-arm64" else
               "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }}

package:
  name: singlejar
  version: ${{ version }}

source:
  - url: ${{ base_url }}/${{ version }}/bazel-${{ version }}-dist.zip
    sha256: 6169ed42d506f3466fac899cc0a1ffa05718dece512cde9c2cd5eebf4e9ff4c3
    patches:
      # Keep these patches in sync with the relevant ones from bazel-feedstock.
      - patches/0001-allow-args-to-be-passed-to-bazel_build.patch
      - patches/0002-Build-with-native-dependencies.patch

  - url: ${{ base_url }}/${{ version }}/bazel_nojdk-${{ version }}-${{ bz_os }}-${{ bz_arch }}
    sha256: ${{ bz_hash }}
    file_name: bazel-${{ version }}

build:
  number: 1
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - bazel-toolchain >=0.5.8
    - openjdk
    - libprotobuf
    - sed
  host:
    - libabseil
    - libabseil-bazel-systemlib
    - libprotobuf
    - libprotobuf-bazel-systemlib
    - protobuf-bazel-rules

tests:
  - script:
      - test -f $PREFIX/bin/singlejar
      - test -f $PREFIX/bin/singlejar_local

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: A tool for generating singleton jars
  homepage: https://github.com/bazelbuild/bazel/tree/master/src/tools/singlejar

extra:
  recipe-maintainers:
    - xhochy
    - h-vetinari
    - conda-forge/bazel
